<svg xmlns='http://www.w3.org/2000/svg' width='200' height='150'>
  <style type='text/css'><![CDATA[
  rect { fill: blue; }
  .warn { fill: orange; stroke: black; stroke-width: 4px }
  #special { fill: green }
  g.box > rect.inner { fill: purple }
  svg g rect.deep { fill: maroon }
  rect.a.b { fill: navy }
  rect:hover { fill: red }
  .imp { fill: lime !important } /* a comment */
  @media print { rect { fill: red } }
  ]]></style>
  <rect x='5' y='5' width='40' height='40'/>
  <rect x='55' y='5' width='40' height='40' class='warn'/>
  <rect x='105' y='5' width='40' height='40' class='warn' id='special'/>
  <rect x='155' y='5' width='40' height='40' fill='red' style='fill: yellow'/>
  <g class='box'><rect class='inner' x='5' y='55' width='40' height='40'/></g>
  <g color='teal'><rect x='55' y='55' width='40' height='40' style='fill:currentColor;stroke:none'/></g>
  <rect x='105' y='55' width='40' height='40' style='fill: hsl(120, 100%, 25%)' />
  <rect x='155' y='55' width='40' height='40' fill='rgb(100%, 50%, 0%)' />
  <rect x='5' y='105' width='40' height='40' class='imp' style='fill: red'/>
  <g><g><rect x='55' y='105' width='40' height='40' class='deep'/></g></g>
  <rect x='105' y='105' width='40' height='40' class='b x a'/>
  <rect x='155' y='105' width='40' height='40' class='box' style='fill: inherit'/>
  </svg>
